<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vaultis Bank | Master Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-8">
    <div class="max-w-xl mx-auto bg-slate-950 border border-red-800/40 p-6 rounded-xl space-y-6 shadow-2xl">
        <h1 class="text-xl font-black text-red-600 border-b border-slate-800 pb-3">Vaultis Bank Master Admin Console</h1>
        
        <div class="p-4 bg-slate-900 border border-slate-800 rounded-lg space-y-4">
            <h2 class="font-bold text-xs text-red-400 uppercase tracking-widest">Create / Post Custom Transaction & Withdrawal</h2>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">Target Username (e.g. emeka or alex)</label>
                <input type="text" id="adm-username" value="emeka" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Target Account</label>
                    <select id="adm-acc" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-sm">
                        <option value="checking">Checking Account</option>
                        <option value="savings">High-Yield Savings</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Transaction Type</label>
                    <select id="adm-type" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-sm">
                        <option value="credit">Credit (Deposit / Inflow)</option>
                        <option value="debit">Debit (Withdrawal / Outflow)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Amount ($)</label>
                <input type="number" step="0.01" id="adm-amount" placeholder="e.g. 3500.00" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-sm">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Purpose / Description (Title)</label>
                <input type="text" id="adm-title" placeholder="e.g. Wire Transfer, ATM Withdrawal" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Transaction Date</label>
                    <input type="date" id="adm-date" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Transaction Time</label>
                    <input type="text" id="adm-time" placeholder="e.g. 03:45 PM" class="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-sm">
                </div>
            </div>

            <button onclick="postCustomTransaction()" class="w-full py-3 bg-red-600 hover:bg-red-700 rounded text-sm font-bold transition">Post Custom Transaction to User Dashboard</button>
        </div>
    </div>

    <script>
        document.getElementById('adm-date').valueAsDate = new Date();
        document.getElementById('adm-time').value = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        async function postCustomTransaction() {
            const username = document.getElementById('adm-username').value.toLowerCase().trim();
            const accountType = document.getElementById('adm-acc').value;
            const type = document.getElementById('adm-type').value;
            const amount = document.getElementById('adm-amount').value;
            const title = document.getElementById('adm-title').value;
            const date = document.getElementById('adm-date').value;
            const time = document.getElementById('adm-time').value;

            if (!username || !amount || !title) {
                alert("Please fill in the username, amount, and purpose.");
                return;
            }

            const res = await fetch('http://localhost:5000/api/admin/transaction', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, accountType, amount, type, title, date, time })
            });

            const json = await res.json();
            alert(json.message);
        }
    </script>
</body>
</html>
